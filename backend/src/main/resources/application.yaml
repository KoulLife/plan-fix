spring:
  application:
    name: plan-fix

  config:
    # 로컬 비밀값 파일. 커밋되지 않으므로 없어도 기동되도록 optional로 둔다.
    import: optional:classpath:application-secret.yml

  mvc:
    async:
      # 수집 API는 외부 API를 수천 번 호출하므로 관대하게 잡는다 (컨트롤러의 WebAsyncTask 타임아웃과 맞춤)
      request-timeout: 30m

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

server:
  tomcat:
    connection-timeout: 20s

security:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-change-me-please}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
